name: Publish Trip Bhai GitHub Pages site

on:
  push:
    branches: [main]
    paths:
      - "public-pages/**"
      - "public/images/**"
      - "public/favicon.svg"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  publish:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare the static site assets
        run: |
          mkdir -p public-pages/assets
          cp public/images/*.jpg public-pages/assets/
          cp public/images/trip-bhai-logo.png public-pages/assets/
          cp public/favicon.svg public-pages/assets/
      - name: Upload the Pages site
        uses: actions/upload-pages-artifact@v3
        with:
          path: public-pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
