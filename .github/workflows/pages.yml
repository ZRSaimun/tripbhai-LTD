name: Publish Trip Bhai GitHub Pages site

# Every push to main that touches the public website (its generator, tests,
# pages, styles, scripts or images) rebuilds, checks and publishes the site at
# https://tripbhai.co.uk/. Merged pull requests and edits made directly on
# GitHub both land as pushes to main, so they trigger this workflow too.
on:
  push:
    branches: [main]
    paths:
      - "public-pages/**"
      - "public/images/**"
      - "public/favicon.svg"
      - "scripts/build-public-site.py"
      - "tests/public-site.test.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  publish:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Generate the public pages from the approved content
        run: python3 scripts/build-public-site.py
      - name: Prepare the static site assets
        run: |
          mkdir -p public-pages/assets
          cp public/images/amalfi.jpg public/images/cappadocia.jpg public/images/london.jpg public-pages/assets/
          cp public/images/trip-bhai-logo.png public-pages/assets/
          cp public/favicon.svg public-pages/assets/
          test -f public-pages/CNAME && cat public-pages/CNAME
      - name: Validate public pages
        run: |
          python3 tests/public-site.test.py
          node --check public-pages/site.js
          # The generator must be the source of truth: committed pages may not drift from it.
          git diff --exit-code -- public-pages/ || { echo "::error::public-pages/ is out of date. Run: python3 scripts/build-public-site.py and commit the result."; exit 1; }
      - name: Upload the Pages site
        uses: actions/upload-pages-artifact@v3
        with:
          path: public-pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
